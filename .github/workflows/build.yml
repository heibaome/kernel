# GhostLock Suite CI：APK 内含 GhostLock + GhostKey 两个提权模块
# （合并自 ghostlock-app 原 CI，新增 :ghostkey 模块所需的 SDK CMake/NDK 组件）
name: Build

on:
  push:
    paths-ignore:
      - "**.md"
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

env:
  ONDK_VERSION: "r30.1"

jobs:
  build-apk:
    name: Build APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          java-version: 21
          distribution: zulu

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            build/extract
          key: cargo-${{ runner.os }}-${{ hashFiles('tools/extract_rs/Cargo.lock') }}

      - name: Test extractor
        working-directory: tools/extract_rs
        run: |
          cargo test --release --features http
          cargo build --release --features http

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # 合并新增：:ghostkey 模块的 externalNativeBuild(cmake) 需要 SDK 侧 CMake
      # 3.22.1（ONDK 不含 CMake）与 AGP 9.1 默认 NDK 28.2.13676358
      # （ghostlock 的 make/cargo 链仍走 ONDK，互不影响）
      - name: Set up Android SDK components for :ghostkey
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMGR="$(command -v sdkmanager || find "$SDK_ROOT" /usr/local/lib/android -type f -name sdkmanager 2>/dev/null | head -1)"
          if [ -z "$SDKMGR" ]; then
            echo "sdkmanager not found; ANDROID_SDK_ROOT=$SDK_ROOT" >&2
            find / -maxdepth 7 -type f -name sdkmanager 2>/dev/null | head -5 >&2
            exit 1
          fi
          echo "sdkmanager: $SDKMGR (sdk root: $SDK_ROOT)"
          yes | "$SDKMGR" --sdk_root="$SDK_ROOT" --licenses > /dev/null 2>&1 || true
          "$SDKMGR" --sdk_root="$SDK_ROOT" --install "cmake;3.22.1" "ndk;28.2.13676358"
          "$SDKMGR" --sdk_root="$SDK_ROOT" --list_installed | grep -E "cmake|ndk"

      - name: Cache ONDK
        id: ondk-cache
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/ondk
          key: ondk-${{ env.ONDK_VERSION }}-linux

      - name: Download ONDK
        if: steps.ondk-cache.outputs.cache-hit != 'true'
        run: |
          url="https://github.com/topjohnwu/ondk/releases/download/${ONDK_VERSION}/ondk-${ONDK_VERSION}-linux.tar.xz"
          mkdir -p "${{ runner.temp }}/ondk"
          curl -fL "$url" -o "${{ runner.temp }}/ondk.tar.xz"
          tar -C "${{ runner.temp }}/ondk" --strip-components=1 -xf "${{ runner.temp }}/ondk.tar.xz"

      - name: Link ONDK Rust toolchain
        run: rustup toolchain link ondk "${{ runner.temp }}/ondk/toolchains/rust"

      - name: Decode Android signing key
        if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
        run: |
          echo ${{ secrets.SIGNING_KEY }} | base64 -d > keystore.jks 2>/dev/null
          SIZE=$(stat -c%s keystore.jks 2>/dev/null || echo 0)
          # A release build must never silently fall back to the ephemeral
          # debug key: that rotates the signature on every run and blocks
          # overwrite installs for every existing user.
          if [ "$SIZE" -eq 0 ]; then
            echo "::error::SIGNING_KEY secret is missing or its base64 is invalid (decoded to 0 bytes). Add it under Settings > Secrets and variables > Actions > Repository secrets, name must be exactly SIGNING_KEY."
            exit 1
          fi
          if ! keytool -list -keystore keystore.jks -storepass "${{ secrets.KEY_STORE_PASSWORD }}" >/dev/null 2>&1; then
            echo "::error::SIGNING_KEY decoded to $SIZE bytes but keytool cannot open it: KEY_STORE_PASSWORD is wrong, or the base64 contains stray line breaks/spaces, or KEY_ALIAS does not exist in the keystore."
            exit 1
          fi
          echo "Release signing certificate fingerprint:"
          keytool -list -v -keystore keystore.jks -storepass "${{ secrets.KEY_STORE_PASSWORD }}" 2>/dev/null | grep -m1 "SHA256:"

      - name: Build Ghostlock binary
        run: |
          export ANDROID_NDK_HOME="${{ runner.temp }}/ondk"
          export NDK_ROOT="$ANDROID_NDK_HOME"
          make -C src ghostlock
          "${{ runner.temp }}/ondk/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip" --strip-all build/native/ghostlock || true

      - name: Build Release APK
        run: |
          export ONDK_HOME="${{ runner.temp }}/ondk"
          export ANDROID_NDK_HOME="$ONDK_HOME"
          export NDK_ROOT="$ONDK_HOME"
          export KEYSTORE_PATH="../keystore.jks"
          export KEYSTORE_PASS="${{ secrets.KEY_STORE_PASSWORD }}"
          export KEY_ALIAS="${{ secrets.ALIAS }}"
          export KEY_PASSWORD="${{ secrets.KEY_PASSWORD }}"
          ./gradlew :app:assembleRelease --no-daemon

      - name: Strip Ghostlock binary
        run: |
          "${{ runner.temp }}/ondk/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip" --strip-all build/native/ghostlock || true

      # splits.abi = arm64-v8a（非 universal）→ APK 落在 app/build/outputs/apk/arm64/release/
      # 用 find 定位而不是写死路径：模块 build 目录与 archivesName 命名都可能变。
      - name: Rename Release APK
        run: |
          APK=$(find . -type f -path '*/outputs/apk/*' -name '*-release.apk' | sort | head -1)
          if [ -z "$APK" ]; then
            echo "no *-release.apk under */outputs/apk/*" >&2
            find . -type f -name '*.apk' -not -path './.git/*' | head -20 >&2
            exit 1
          fi
          echo "apk: $APK ($(stat -c%s "$APK") bytes)"
          mv "$APK" GhostLock-Suite-release.apk

      - name: Prepare extractor binaries
        run: |
          cp build/extract/release/ghostlock-extract tools/extract_rs/ghostlock-extract-linux-x86_64

          export CC_aarch64_linux_android="${{ runner.temp }}/ondk/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android35-clang"
          export AR_aarch64_linux_android="${{ runner.temp }}/ondk/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$CC_aarch64_linux_android"
          export RUSTC_BOOTSTRAP=1
          export RUSTFLAGS="-C force-unwind-tables=no -C link-arg=-Wl,--icf=all"
          cargo +ondk build --release --target aarch64-linux-android --features http --manifest-path tools/extract_rs/Cargo.toml --target-dir build/extract \
            -Z build-std=std,panic_abort -Z build-std-features=optimize_for_size
          cp build/extract/aarch64-linux-android/release/ghostlock-extract tools/extract_rs/ghostlock-extract-android-arm64

      - name: Export kernel profiles (GLK1)
        run: ./gradlew exportKernelProfiles --no-daemon

      - name: Package kernel profiles
        run: |
          cd build/kernel-profiles
          zip -r "$GITHUB_WORKSPACE/GhostLock-kernel-profiles.zip" .
          unzip -l "$GITHUB_WORKSPACE/GhostLock-kernel-profiles.zip" | tail -5

      - name: Upload Release APK
        uses: actions/upload-artifact@v7
        with:
          name: GhostLock-Suite-release
          path: GhostLock-Suite-release.apk
          archive: false

      - name: Upload kernel profiles
        uses: actions/upload-artifact@v7
        with:
          name: GhostLock-kernel-profiles
          path: GhostLock-kernel-profiles.zip
          archive: false

      - name: Upload Ghostlock binary
        uses: actions/upload-artifact@v7
        with:
          name: ghostlock
          path: build/native/ghostlock
          archive: false

      - name: Upload Extractor Linux
        uses: actions/upload-artifact@v7
        with:
          name: ghostlock-extract-linux-x86_64
          path: tools/extract_rs/ghostlock-extract-linux-x86_64
          archive: false

      - name: Upload Extractor Android
        uses: actions/upload-artifact@v7
        with:
          name: ghostlock-extract-android-arm64
          path: tools/extract_rs/ghostlock-extract-android-arm64
          archive: false

  build-extractor-macos:
    name: Build Extractor (macOS)
    runs-on: macos-latest
    # macOS runner 长期排队/幽灵 in_progress（曾把整个 run 卡住 30 分钟以上），
    # 它只是可选产物：失败或超时不得拖垮发版与其它产物。
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache Cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            build/extract
          key: cargo-${{ runner.os }}-${{ hashFiles('tools/extract_rs/Cargo.lock') }}

      - name: Build macOS universal binary
        working-directory: tools/extract_rs
        run: |
          cargo build --release --features http --target aarch64-apple-darwin
          cargo build --release --features http --target x86_64-apple-darwin
          mkdir -p bin
          lipo -create -output bin/ghostlock-extract-macos-universal \
            ../../build/extract/aarch64-apple-darwin/release/ghostlock-extract \
            ../../build/extract/x86_64-apple-darwin/release/ghostlock-extract

      - name: Upload Extractor macOS
        uses: actions/upload-artifact@v7
        with:
          name: ghostlock-extract-macos-universal
          path: tools/extract_rs/bin/ghostlock-extract-macos-universal
          archive: false

  build-extractor-windows:
    name: Build Extractor (Windows)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            build/extract
          key: cargo-${{ runner.os }}-${{ hashFiles('tools/extract_rs/Cargo.lock') }}

      - name: Build Windows binary
        shell: bash
        working-directory: tools/extract_rs
        run: |
          cargo build --release --features http
          mkdir -p bin
          cp ../../build/extract/release/ghostlock-extract.exe bin/ghostlock-extract-windows-x86_64.exe

      - name: Upload Extractor Windows
        uses: actions/upload-artifact@v7
        with:
          name: ghostlock-extract-windows-x86_64
          path: tools/extract_rs/bin/ghostlock-extract-windows-x86_64.exe
          archive: false

  prerelease:
    name: Pre-release
    # 只等"必须"的产物：APK 与 Windows 提取器。macOS 提取器是可选项
    # （continue-on-error），不参与 needs，否则 macOS runner 排队会把发版一起卡死。
    needs: [build-apk, build-extractor-windows]
    runs-on: ubuntu-latest
    if: ${{ success() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && github.ref_type != 'tag' }}
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          skip-decompress: true

      - name: Prepare release files and notes
        run: |
          mkdir -p release-files
          find artifacts -type f -exec cp {} release-files/ \;
          chmod +x release-files/ghostlock release-files/ghostlock-extract-* || true

          cd release-files
          for f in GhostLock-Suite-release.apk ghostlock ghostlock-extract-* GhostLock-kernel-profiles.zip; do
            if [ -f "$f" ]; then
              sha256sum "$f"
            fi
          done > sha256sum.txt
          cd ..

          VERSION_NAME=$(sed -nE 's/^[[:space:]]*val appVersionName = "([^"]+)".*/\1/p' app/build.gradle.kts)
          SHORT_HASH=$(git rev-parse --short HEAD)
          COMMIT_COUNT=$(git rev-list --count HEAD)
          COMMIT_MSG=$(git log -1 --pretty=%B)

          export VERSION_NAME
          export SHORT_HASH
          export COMMIT_COUNT
          export COMMIT_MSG

          python3 - <<'PY'
          import os

          version = os.environ.get("VERSION_NAME", "Unknown")
          short_hash = os.environ.get("SHORT_HASH", "Unknown")
          commit_count = os.environ.get("COMMIT_COUNT", "0")
          commit_msg = os.environ.get("COMMIT_MSG", "No commit message").strip()
          repo = os.environ.get("GITHUB_REPOSITORY", "YuKongA/ghostlock-app")
          sha = os.environ.get("GITHUB_SHA", "")

          with open("release-files/sha256sum.txt", "r", encoding="utf-8") as f:
              checksums = f.read().strip()

          lines = [
              "### GhostLock Suite Pre-release",
              "",
              f"- **Version**: `v{version}` (`{commit_count}`)",
              f"- **Commit**: [`{short_hash}`](https://github.com/{repo}/commit/{sha})",
              "",
              "#### Commit Message",
              "```",
              commit_msg,
              "```",
              "",
              "#### Files",
              "- `GhostLock-Suite-release.apk`: GhostLock Suite (GhostLock + GhostKey) Android Application",
              "- `ghostlock`: Standalone GhostLock native binary (Android arm64-v8a)",
              "- `GhostLock-kernel-profiles.zip`: Bundled kernel profiles (HOCON)",
              "- `ghostlock-extract-android-arm64`: Kernel offset extractor CLI (Android arm64-v8a)",
              "- `ghostlock-extract-linux-x86_64`: Kernel offset extractor CLI (Linux x86_64)",
              "- `ghostlock-extract-macos-universal`: Kernel offset extractor CLI (macOS Universal arm64 + x86_64)",
              "- `ghostlock-extract-windows-x86_64.exe`: Kernel offset extractor CLI (Windows x86_64)",
              "",
              "#### SHA256 Checksums",
              "```",
              checksums,
              "```",
          ]
          notes = "\n".join(lines) + "\n"

          with open("release-notes.md", "w", encoding="utf-8") as f:
              f.write(notes)
          PY

      - name: Update Git Tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f pre-release
          git push -f origin pre-release
          gh release edit pre-release --target ${{ github.sha }} 2>/dev/null || true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: pre-release
          target_commitish: ${{ github.sha }}
          name: GhostLock Pre-release
          body_path: release-notes.md
          prerelease: true
          files: release-files/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  post_telegram:
    # 同上：不依赖 macOS 可选产物，避免通知任务排在 macOS runner 后面。
    needs: [build-apk, build-extractor-windows]
    runs-on: ubuntu-latest
    if: ${{ success() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && github.ref_type != 'tag' }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          skip-decompress: true

      - name: Post to Telegram
        env:
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          BOT_API_LINK: ${{ secrets.BOT_API_LINK }}
        run: bash .github/scripts/post_telegram.sh
